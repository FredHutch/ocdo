project:
  type: website
  resources:
    - dasl/**
    - proof/**
  render:
    - "*.qmd"
    - "!dasl-src/**"
    - "!proof-src/**"

website:
  google-analytics: "G-F8NWF32PC7"
  cookie-consent: false
  page-navigation: true
  search:
    location: navbar
    type: textbox
  favicon: /img/favicon.png
  open-graph: true
  navbar:
    logo: img/Fred-Hutch-Logo-Primary.png
    logo-alt: "Logo for Fred Hutch Cancer Center"

  sidebar:
    style: "floating"
    search: false
    contents:
      - section: "Resources"
        contents:
          - text: "Fred Hutch Accelerator"
            href: https://accelerator.fredhutch.org/
          - text: "SciWiki"
            href: https://sciwiki.fredhutch.org/
          - text: "Fred Hutch Data Slack"
            href: https://join.slack.com/t/fhdata/signup
          - text: "Training & Community"
            href: https://ocdo.fredhutch.org/dasl
          - text: "Human Computer Interaction"
            href: programs/wildscp.qmd
          - text: "WILDS"
            href: https://getwilds.org/


format:
  html:
    page-layout: full
    theme:
      - cosmo
      - styles.scss
    link-color: "#00ABC8"
    fontsize: 1.1em
    toc: false
    toc-depth: 2
    link-external-icon: true
    link-external-newwindow: true
    anchor-sections: true
